name: 6v6

# ─────────────────────────────────────────────────────────────
# 6v6 — CCC 인프라의 단일 docker-compose 버전.
# 단일 bridge network 10.20.30.0/24 — 강의 자료 IP 스킴 그대로.
# 7 취약 웹 + Wazuh 통합 (agent + syslog 두 패러다임).
# ─────────────────────────────────────────────────────────────

services:

  # ─── bastion: SSH 점프 + Bastion API + rsyslog forwarder ──
  bastion:
    container_name: 6v6-bastion
    build:
      context: .
      dockerfile: bastion/Dockerfile
    hostname: bastion
    networks:
      6v6-net:
        ipv4_address: 10.20.30.201
    ports:
      - "${PORT_BASTION_SSH:-2204}:22"
      - "${PORT_BASTION_API:-9100}:9100"
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      API_KEY: ${API_KEY:-ccc-api-key-2026}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      SIEM_HOST: siem
    volumes:
      - bastion-data:/var/lib/bastion
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ─── secu: nftables + Suricata + Wazuh agent ───────────────
  secu:
    container_name: 6v6-secu
    build:
      context: .
      dockerfile: secu/Dockerfile
    hostname: secu
    networks:
      6v6-net:
        ipv4_address: 10.20.30.1
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      WAZUH_MANAGER: siem
    volumes:
      - secu-suricata-logs:/var/log/suricata
    depends_on:
      - siem
    restart: unless-stopped

  # ─── web: Apache + ModSec + 랜딩 + 7 vuln reverse proxy + Wazuh agent ──
  web:
    container_name: 6v6-web
    build:
      context: .
      dockerfile: web/Dockerfile
    hostname: web
    networks:
      6v6-net:
        ipv4_address: 10.20.30.80
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      WAZUH_MANAGER: siem
    volumes:
      - web-apache-logs:/var/log/apache2
    depends_on:
      - siem
      - juiceshop
      - dvwa
      - neobank
      - govportal
      - mediforum
      - adminconsole
      - aicompanion
    restart: unless-stopped

  # ─── 취약 웹 7개 (web 의 reverse proxy 만 접근, 외부 노출 X) ──
  juiceshop:
    container_name: 6v6-juiceshop
    image: bkimminich/juice-shop:latest
    hostname: juiceshop
    networks:
      6v6-net:
        ipv4_address: 10.20.30.81
    restart: unless-stopped

  dvwa:
    container_name: 6v6-dvwa
    image: vulnerables/web-dvwa:latest
    hostname: dvwa
    networks:
      6v6-net:
        ipv4_address: 10.20.30.82
    restart: unless-stopped

  neobank:
    container_name: 6v6-neobank
    build:
      context: ./vuln-sites/neobank
    hostname: neobank
    networks:
      6v6-net:
        ipv4_address: 10.20.30.83
    environment:
      PORT: 3001
    restart: unless-stopped

  govportal:
    container_name: 6v6-govportal
    build:
      context: ./vuln-sites/govportal
    hostname: govportal
    networks:
      6v6-net:
        ipv4_address: 10.20.30.84
    environment:
      PORT: 3002
    restart: unless-stopped

  mediforum:
    container_name: 6v6-mediforum
    build:
      context: ./vuln-sites/mediforum
    hostname: mediforum
    networks:
      6v6-net:
        ipv4_address: 10.20.30.85
    environment:
      PORT: 3003
    restart: unless-stopped

  adminconsole:
    container_name: 6v6-adminconsole
    build:
      context: ./vuln-sites/adminconsole
    hostname: adminconsole
    networks:
      6v6-net:
        ipv4_address: 10.20.30.86
    environment:
      PORT: 3004
    restart: unless-stopped

  aicompanion:
    container_name: 6v6-aicompanion
    build:
      context: ./vuln-sites/aicompanion
    hostname: aicompanion
    networks:
      6v6-net:
        ipv4_address: 10.20.30.87
    environment:
      PORT: 3005
      LLM_BACKEND: ${AICOMPANION_LLM_BACKEND:-mock}
      OLLAMA_URL: ${LLM_BASE_URL:-}
      OLLAMA_MODEL: ${LLM_MODEL:-gemma3:4b}
    restart: unless-stopped

  # ─── siem: Wazuh manager (agent + syslog 둘 다 입력) + viewer ──
  siem:
    container_name: 6v6-siem
    build:
      context: .
      dockerfile: siem/Dockerfile
    hostname: siem
    networks:
      6v6-net:
        ipv4_address: 10.20.30.100
    ports:
      - "${PORT_SIEM_DASH:-5601}:5601"
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
    volumes:
      - siem-data:/var/lib/siem
      - siem-wazuh:/var/ossec
    restart: unless-stopped

  # ─── attacker: pentest 도구 + rsyslog forwarder ────────────
  attacker:
    container_name: 6v6-attacker
    build:
      context: .
      dockerfile: attacker/Dockerfile
    hostname: attacker
    networks:
      6v6-net:
        ipv4_address: 10.20.30.202
    ports:
      - "${PORT_ATTACKER_SSH:-2202}:22"
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      SIEM_HOST: siem
    volumes:
      - attacker-home:/home/ccc
    depends_on:
      - siem
    restart: unless-stopped

  # ─── portal: 관리 대시보드 ───────────────────────────────
  portal:
    container_name: 6v6-portal
    build:
      context: .
      dockerfile: portal/Dockerfile
    hostname: portal
    networks:
      6v6-net:
        ipv4_address: 10.20.30.50
    ports:
      - "${PORT_PORTAL:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - secu-suricata-logs:/data/suricata-logs:ro
      - web-apache-logs:/data/apache-logs:ro
      - bastion-data:/data/bastion-data:ro
      - siem-data:/data/siem-data:ro
      - siem-wazuh:/data/wazuh:ro
    environment:
      BASTION_API_URL: http://bastion:9100
      BASTION_API_KEY: ${API_KEY:-ccc-api-key-2026}
    depends_on:
      - bastion
      - secu
      - web
      - siem
      - attacker
    restart: unless-stopped


networks:
  6v6-net:
    name: 6v6-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.30.0/24
          gateway: 10.20.30.254


volumes:
  bastion-data:
  secu-suricata-logs:
  web-apache-logs:
  siem-data:
  siem-wazuh:
  attacker-home:
