name: 6v6

# ─────────────────────────────────────────────────────────────
# 6v6 — 4-tier chained topology: ext -> pipe -> dmz -> int
# Enforced packet flow: external -> fw -> ips -> [waf -> ] endpoint
# ─────────────────────────────────────────────────────────────

services:

  # ╭─ ext tier ─────────────────────────────────────────────╮
  # │                                                        │
  bastion:
    container_name: 6v6-bastion
    build:
      context: .
      dockerfile: bastion/Dockerfile
    hostname: bastion
    networks:
      ext:
        ipv4_address: 10.20.30.201
    ports:
      - "${PORT_BASTION_SSH:-2204}:22"
    cap_add: [NET_ADMIN]
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      API_KEY: ${API_KEY:-ccc-api-key-2026}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      DEFAULT_GW: 10.20.30.1
    volumes:
      - bastion-data:/var/lib/bastion
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  attacker:
    container_name: 6v6-attacker
    build:
      context: .
      dockerfile: attacker/Dockerfile
    hostname: attacker
    networks:
      ext:
        ipv4_address: 10.20.30.202
    ports:
      - "${PORT_ATTACKER_SSH:-2202}:22"
    cap_add: [NET_ADMIN]
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      DEFAULT_GW: 10.20.30.1
    # 6v6 vhost — attacker 에서 curl http://juice.6v6.lab/... 직접 가능하도록
    # /etc/hosts 자동 매핑. web (10.20.32.80) 의 Apache + ModSec reverse proxy 가
    # host header 기반 backend (juiceshop:3000 등) 로 라우팅. siem 은 dashboard 직접.
    extra_hosts:
      - "juice.6v6.lab:10.20.32.80"
      - "dvwa.6v6.lab:10.20.32.80"
      - "neobank.6v6.lab:10.20.32.80"
      - "govportal.6v6.lab:10.20.32.80"
      - "mediforum.6v6.lab:10.20.32.80"
      - "adminconsole.6v6.lab:10.20.32.80"
      - "aicompanion.6v6.lab:10.20.32.80"
      - "siem.6v6.lab:10.20.32.100"
    volumes:
      - attacker-home:/home/ccc
    restart: unless-stopped

  # ╭─ Edge router: ext <-> pipe ────────────────────────────╮
  fw:
    container_name: 6v6-fw
    build:
      context: .
      dockerfile: fw/Dockerfile
    hostname: fw
    networks:
      ext:
        ipv4_address: 10.20.30.1
        # 6v6-secu = 4-VM 시대 legacy alias (fw + ips 합쳐졌던 옛 secu VM 의 이름).
        # 학생 PC 의 ~/.ssh/config 에 Host 6v6-secu 가 ProxyJump 6v6-bastion 으로
        # 작성된 경우 bastion 안에서 6v6-secu 를 fw 로 매핑 → DNS resolve 통과.
        aliases: [secu, 6v6-secu]
      pipe:
        ipv4_address: 10.20.31.1
        aliases: [secu, 6v6-secu]
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
      - "${PORT_BASTION_API:-9100}:9100"   # fw HAProxy → bastion API
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      WAZUH_MANAGER: 10.20.32.100
      IPS_PIPE_IP: 10.20.31.2
    restart: unless-stopped

  # ╭─ IPS: pipe <-> dmz (Suricata sniff + ip_forward) ────╮
  ips:
    container_name: 6v6-ips
    build:
      context: .
      dockerfile: ips/Dockerfile
    hostname: ips
    networks:
      pipe:
        ipv4_address: 10.20.31.2
      dmz:
        ipv4_address: 10.20.32.1
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      WAZUH_MANAGER: 10.20.32.100
      FW_PIPE_IP: 10.20.31.1
    volumes:
      - ips-suricata-logs:/var/log/suricata
    depends_on:
      - fw
    restart: unless-stopped

  # ╭─ DMZ tier: WAF + management services ──────────────────╮
  web:
    container_name: 6v6-web
    build:
      context: .
      dockerfile: web/Dockerfile
    hostname: web
    networks:
      dmz:
        ipv4_address: 10.20.32.80
      int:
        ipv4_address: 10.20.40.80
    cap_add: [NET_ADMIN]
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      WAZUH_MANAGER: 10.20.32.100
      DEFAULT_GW: 10.20.32.1   # via ips
    volumes:
      - web-apache-logs:/var/log/apache2
    depends_on:
      - ips
      - juiceshop
      - dvwa
      - neobank
      - govportal
      - mediforum
      - adminconsole
      - aicompanion
    restart: unless-stopped

  wazuh-indexer:
    container_name: 6v6-wazuh-indexer
    image: wazuh/wazuh-indexer:4.10.0
    hostname: wazuh.indexer
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh-config/certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./wazuh-config/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./wazuh-config/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./wazuh-config/certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./wazuh-config/certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./wazuh-config/wazuh_indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./wazuh-config/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    networks:
      dmz:
        ipv4_address: 10.20.32.110
        aliases: [wazuh.indexer, wazuh-indexer]
    restart: unless-stopped

  siem:
    container_name: 6v6-siem
    build:
      context: .
      dockerfile: siem/Dockerfile
    image: 6v6-siem:custom
    hostname: wazuh.manager
    depends_on: [wazuh-indexer]
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    volumes:
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-queue:/var/ossec/queue
      - wazuh-manager-var:/var/ossec/var
      - ./wazuh-config/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh-config/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh-config/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      # - ./wazuh-config/api.yaml:/var/ossec/api/configuration/api.yaml  # TEMP REMOVED (DB sqlite open conflict)
    networks:
      dmz:
        ipv4_address: 10.20.32.100
        aliases: [siem, wazuh.manager, wazuh-manager]
    restart: unless-stopped

  wazuh-dashboard:
    container_name: 6v6-wazuh-dashboard
    image: wazuh/wazuh-dashboard:4.10.0
    hostname: wazuh.dashboard
    depends_on: [wazuh-indexer, siem]
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: kibanaserver
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    volumes:
      - ./wazuh-config/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh-config/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh-config/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh-config/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh-config/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    networks:
      dmz:
        ipv4_address: 10.20.32.120
        aliases: [wazuh.dashboard, wazuh-dashboard]
    restart: unless-stopped

  portal:
    container_name: 6v6-portal
    build:
      context: .
      dockerfile: portal/Dockerfile
    hostname: portal
    networks:
      dmz:
        ipv4_address: 10.20.32.50
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ips-suricata-logs:/data/suricata-logs:ro
      - web-apache-logs:/data/apache-logs:ro
      - bastion-data:/data/bastion-data:ro
      - wazuh-manager-logs:/data/wazuh:ro
    environment:
      BASTION_API_URL: http://10.20.30.201:9100
      BASTION_API_KEY: ${API_KEY:-ccc-api-key-2026}
    depends_on: [siem, web]
    restart: unless-stopped

  # ╭─ int tier: vuln endpoints (behind WAF) ─────────────────╮
  juiceshop:
    container_name: 6v6-juiceshop
    image: bkimminich/juice-shop:latest
    hostname: juiceshop
    networks:
      int: { ipv4_address: 10.20.40.81 }
    restart: unless-stopped

  dvwa:
    container_name: 6v6-dvwa
    image: vulnerables/web-dvwa:latest
    hostname: dvwa
    networks:
      int: { ipv4_address: 10.20.40.82 }
    restart: unless-stopped

  neobank:
    container_name: 6v6-neobank
    build: { context: ./vuln-sites/neobank }
    hostname: neobank
    networks:
      int: { ipv4_address: 10.20.40.83 }
    environment: { PORT: 3001 }
    restart: unless-stopped

  govportal:
    container_name: 6v6-govportal
    build: { context: ./vuln-sites/govportal }
    hostname: govportal
    networks:
      int: { ipv4_address: 10.20.40.84 }
    environment: { PORT: 3002 }
    restart: unless-stopped

  mediforum:
    container_name: 6v6-mediforum
    build: { context: ./vuln-sites/mediforum }
    hostname: mediforum
    networks:
      int: { ipv4_address: 10.20.40.85 }
    environment: { PORT: 3003 }
    restart: unless-stopped

  adminconsole:
    container_name: 6v6-adminconsole
    build: { context: ./vuln-sites/adminconsole }
    hostname: adminconsole
    networks:
      int: { ipv4_address: 10.20.40.86 }
    environment: { PORT: 3004 }
    restart: unless-stopped

  aicompanion:
    container_name: 6v6-aicompanion
    build: { context: ./vuln-sites/aicompanion }
    hostname: aicompanion
    networks:
      int: { ipv4_address: 10.20.40.87 }
    environment:
      PORT: 3005
      LLM_BACKEND: ${AICOMPANION_LLM_BACKEND:-mock}
      OLLAMA_URL: ${LLM_BASE_URL:-}
      OLLAMA_MODEL: ${LLM_MODEL:-gemma3:4b}
    restart: unless-stopped


networks:
  ext:
    name: 6v6-ext
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.30.0/24
          gateway: 10.20.30.254

  # internal:true 는 host iptables 에 cross-bridge drop 룰을 추가해서 ips 의
  # 인터-브릿지 forwarding 을 차단함. 체이닝은 default route 로 강제 (fw/ips
  # 가 ext->dmz->int 경로의 hop). 컨테이너 outbound 는 docker NAT 로 허용.
  pipe:
    name: 6v6-pipe
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.31.0/24
          gateway: 10.20.31.254

  dmz:
    name: 6v6-dmz
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.32.0/24
          gateway: 10.20.32.254

  int:
    name: 6v6-int
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.40.0/24
          gateway: 10.20.40.254


volumes:
  bastion-data:
  ips-suricata-logs:
  web-apache-logs:
  wazuh-indexer-data:
  wazuh-manager-etc:
  wazuh-manager-logs:
  wazuh-manager-queue:
  wazuh-manager-var:
  attacker-home:
