name: 6v6

# ─────────────────────────────────────────────────────────────
# 6v6 — CCC infra single-VM docker version
# Single bridge 10.20.30.0/24 + 7 vuln sites + full Wazuh stack.
# ─────────────────────────────────────────────────────────────

services:

  # ─── bastion ─────────────────────────────────────────────
  bastion:
    container_name: 6v6-bastion
    build:
      context: .
      dockerfile: bastion/Dockerfile
    hostname: bastion
    networks:
      6v6-net:
        ipv4_address: 10.20.30.201
    ports:
      - "${PORT_BASTION_SSH:-2204}:22"
      - "${PORT_BASTION_API:-9100}:9100"
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      API_KEY: ${API_KEY:-ccc-api-key-2026}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      SIEM_HOST: wazuh.manager
    volumes:
      - bastion-data:/var/lib/bastion
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ─── secu: nftables + Suricata + Wazuh agent ───────────
  secu:
    container_name: 6v6-secu
    build:
      context: .
      dockerfile: secu/Dockerfile
    hostname: secu
    networks:
      6v6-net:
        ipv4_address: 10.20.30.1
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      WAZUH_MANAGER: 10.20.30.100
    volumes:
      - secu-suricata-logs:/var/log/suricata
    depends_on:
      - siem
    restart: unless-stopped

  # ─── web: Apache + ModSec + 8 vhost reverse proxy + Wazuh agent ──
  web:
    container_name: 6v6-web
    build:
      context: .
      dockerfile: web/Dockerfile
    hostname: web
    networks:
      6v6-net:
        ipv4_address: 10.20.30.80
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      WAZUH_MANAGER: 10.20.30.100
    volumes:
      - web-apache-logs:/var/log/apache2
    depends_on:
      - siem
      - juiceshop
      - dvwa
      - neobank
      - govportal
      - mediforum
      - adminconsole
      - aicompanion
      - wazuh-dashboard
      - portal
    restart: unless-stopped

  # ─── 7 vuln backends ────────────────────────────────────
  juiceshop:
    container_name: 6v6-juiceshop
    image: bkimminich/juice-shop:latest
    hostname: juiceshop
    networks:
      6v6-net:
        ipv4_address: 10.20.30.81
    restart: unless-stopped

  dvwa:
    container_name: 6v6-dvwa
    image: vulnerables/web-dvwa:latest
    hostname: dvwa
    networks:
      6v6-net:
        ipv4_address: 10.20.30.82
    restart: unless-stopped

  neobank:
    container_name: 6v6-neobank
    build: { context: ./vuln-sites/neobank }
    hostname: neobank
    networks:
      6v6-net:
        ipv4_address: 10.20.30.83
    environment: { PORT: 3001 }
    restart: unless-stopped

  govportal:
    container_name: 6v6-govportal
    build: { context: ./vuln-sites/govportal }
    hostname: govportal
    networks:
      6v6-net:
        ipv4_address: 10.20.30.84
    environment: { PORT: 3002 }
    restart: unless-stopped

  mediforum:
    container_name: 6v6-mediforum
    build: { context: ./vuln-sites/mediforum }
    hostname: mediforum
    networks:
      6v6-net:
        ipv4_address: 10.20.30.85
    environment: { PORT: 3003 }
    restart: unless-stopped

  adminconsole:
    container_name: 6v6-adminconsole
    build: { context: ./vuln-sites/adminconsole }
    hostname: adminconsole
    networks:
      6v6-net:
        ipv4_address: 10.20.30.86
    environment: { PORT: 3004 }
    restart: unless-stopped

  aicompanion:
    container_name: 6v6-aicompanion
    build: { context: ./vuln-sites/aicompanion }
    hostname: aicompanion
    networks:
      6v6-net:
        ipv4_address: 10.20.30.87
    environment:
      PORT: 3005
      LLM_BACKEND: ${AICOMPANION_LLM_BACKEND:-mock}
      OLLAMA_URL: ${LLM_BASE_URL:-}
      OLLAMA_MODEL: ${LLM_MODEL:-gemma3:4b}
    restart: unless-stopped

  # ─── Wazuh full stack — indexer + manager + dashboard ──
  wazuh-indexer:
    container_name: 6v6-wazuh-indexer
    image: wazuh/wazuh-indexer:4.10.0
    hostname: wazuh.indexer
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh-config/certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./wazuh-config/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./wazuh-config/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./wazuh-config/certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./wazuh-config/certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./wazuh-config/wazuh_indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./wazuh-config/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    networks:
      6v6-net:
        ipv4_address: 10.20.30.110
        aliases: [wazuh.indexer, wazuh-indexer]
    restart: unless-stopped

  # siem == wazuh-manager (official image). Service name 'siem' for CLI clarity.
  siem:
    container_name: 6v6-siem
    image: wazuh/wazuh-manager:4.10.0
    hostname: wazuh.manager
    depends_on: [wazuh-indexer]
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    volumes:
      - siem-etc:/var/ossec/etc
      - siem-logs:/var/ossec/logs
      - siem-queue:/var/ossec/queue
      - siem-var:/var/ossec/var
      - ./wazuh-config/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh-config/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh-config/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
    networks:
      6v6-net:
        ipv4_address: 10.20.30.100
        aliases: [siem, wazuh.manager, wazuh-manager]
    restart: unless-stopped

  wazuh-dashboard:
    container_name: 6v6-wazuh-dashboard
    image: wazuh/wazuh-dashboard:4.10.0
    hostname: wazuh.dashboard
    depends_on: [wazuh-indexer, siem]
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: kibanaserver
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    volumes:
      - ./wazuh-config/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh-config/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh-config/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh-config/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh-config/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    networks:
      6v6-net:
        ipv4_address: 10.20.30.120
        aliases: [wazuh.dashboard, wazuh-dashboard]
    restart: unless-stopped

  # ─── attacker ────────────────────────────────────────────
  attacker:
    container_name: 6v6-attacker
    build:
      context: .
      dockerfile: attacker/Dockerfile
    hostname: attacker
    networks:
      6v6-net:
        ipv4_address: 10.20.30.202
    ports:
      - "${PORT_ATTACKER_SSH:-2202}:22"
    environment:
      SSH_USER: ${SSH_USER:-ccc}
      SSH_PASS: ${SSH_PASS:-ccc}
      SIEM_HOST: 10.20.30.100
    volumes:
      - attacker-home:/home/ccc
    depends_on:
      - siem
    restart: unless-stopped

  # ─── portal ──────────────────────────────────────────────
  portal:
    container_name: 6v6-portal
    build:
      context: .
      dockerfile: portal/Dockerfile
    hostname: portal
    networks:
      6v6-net:
        ipv4_address: 10.20.30.50
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - secu-suricata-logs:/data/suricata-logs:ro
      - web-apache-logs:/data/apache-logs:ro
      - bastion-data:/data/bastion-data:ro
      - siem-logs:/data/wazuh:ro
    environment:
      BASTION_API_URL: http://bastion:9100
      BASTION_API_KEY: ${API_KEY:-ccc-api-key-2026}
    depends_on:
      - bastion
      - secu
      - web
      - siem
      - attacker
    restart: unless-stopped


networks:
  6v6-net:
    name: 6v6-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.30.0/24
          gateway: 10.20.30.254


volumes:
  bastion-data:
  secu-suricata-logs:
  web-apache-logs:
  wazuh-indexer-data:
  wazuh-manager-etc:
  wazuh-manager-logs:
  wazuh-manager-queue:
  wazuh-manager-var:
  attacker-home:
