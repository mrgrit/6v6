# 6v6 default landing vhost — IP 직접 접근 또는 다른 vhost 미매칭 시 응답
<VirtualHost *:80>
    ServerName landing
    DocumentRoot /var/www/landing

    <Directory /var/www/landing>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # JuiceShop reverse proxy — http://VMIP/juice/
    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket support (JuiceShop 일부 기능)
    ProxyPass /juice/socket.io/ ws://juiceshop:3000/socket.io/
    ProxyPassReverse /juice/socket.io/ ws://juiceshop:3000/socket.io/

    ProxyPass /juice/ http://juiceshop:3000/
    ProxyPassReverse /juice/ http://juiceshop:3000/

    ErrorLog ${APACHE_LOG_DIR}/landing_error.log
    CustomLog ${APACHE_LOG_DIR}/landing_access.log combined
</VirtualHost>
