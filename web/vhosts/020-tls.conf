# 6v6 TLS — self-signed cert, 모든 vhost 동일 이용 (entrypoint 가 cert 생성)
<VirtualHost *:443>
    ServerName landing
    DocumentRoot /var/www/landing

    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/server.key

    <Directory /var/www/landing>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /juice/socket.io/ ws://juiceshop:3000/socket.io/
    ProxyPassReverse /juice/socket.io/ ws://juiceshop:3000/socket.io/
    ProxyPass /juice/ http://juiceshop:3000/
    ProxyPassReverse /juice/ http://juiceshop:3000/

    ErrorLog ${APACHE_LOG_DIR}/landing_tls_error.log
    CustomLog ${APACHE_LOG_DIR}/landing_tls_access.log combined
</VirtualHost>
