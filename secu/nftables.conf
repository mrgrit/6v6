#!/usr/sbin/nft -f
# 6v6 secu — 학습용 nftables ruleset.
#
# ⚠ 'flush ruleset' 사용 금지 — docker bridge 의 embedded DNS (127.0.0.11) 를
#   라우팅하는 NAT 룰이 같이 날아가 Wazuh agent / Suricata 등이 hostname 해석 실패함.
#   대신 우리 전용 테이블 '6v6_filter' 만 정의 → docker 의 docker-* 테이블과 공존.

# 우리 전용 필터 테이블 (있으면 한 번 비우고 재생성)
add table inet 6v6_filter
flush table inet 6v6_filter

table inet 6v6_filter {
    chain input {
        type filter hook input priority 0; policy accept;
        # 학습 환경 — 모두 accept (학생이 룰 추가/수정 학습)
        tcp dport 22 accept
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept
        ct state established,related accept
    }

    chain forward {
        type filter hook forward priority 0; policy accept;
        # secu 가 게이트웨이 역할 — 학생이 'ip saddr ... drop' 추가 학습
        ct state established,related accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

# 학습용 NAT — 비활성 (실제 NAT 는 docker bridge 가 처리)
add table ip 6v6_nat
flush table ip 6v6_nat
table ip 6v6_nat {
    chain prerouting {
        type nat hook prerouting priority -100;
    }
    chain postrouting {
        type nat hook postrouting priority 100;
    }
}
