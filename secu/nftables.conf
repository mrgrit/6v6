#!/usr/sbin/nft -f
# 6v6 secu — 학습용 stateful firewall ruleset.
# 학생이 nft 명령으로 직접 룰을 살펴보고 수정하는 첫 번째 실습 대상.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;
        # 학습 환경 — INPUT 은 일단 모두 accept. 22(ssh) 명시.
        tcp dport 22 accept
        # ICMP 허용
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept
        # 자기 자신에게 오는 conntrack established 허용
        ct state established,related accept
    }

    chain forward {
        type filter hook forward priority 0; policy accept;
        # secu 가 attacker → web 트래픽을 통과시키는 게이트웨이 역할 (학습용 accept).
        # 실습 단계에서 학생이 'ip saddr 10.20.30.202 drop' 같은 룰 추가/삭제 학습.
        ct state established,related accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

# 학습용 NAT — 실제 docker bridge 가 NAT 처리하지만 학생이 nft NAT 룰 작성 학습 가능.
table ip nat {
    chain prerouting {
        type nat hook prerouting priority -100;
    }
    chain postrouting {
        type nat hook postrouting priority 100;
    }
}
