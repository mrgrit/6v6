#!/usr/sbin/nft -f
# 6v6 fw — edge router firewall (ext <-> pipe).
# 'flush ruleset' 회피 — docker DNS 보존 위해 우리 테이블만 정의.

add table inet 6v6_filter
flush table inet 6v6_filter

table inet 6v6_filter {
    chain input {
        type filter hook input priority 0; policy accept;
        # Limit ssh to ext-net (bastion/attacker side)
        tcp dport 22 accept
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept
        ct state established,related accept
    }

    chain forward {
        type filter hook forward priority 0; policy accept;
        # ext (10.20.30.0/24) -> pipe (10.20.31.0/24): SSH/HTTP/etc 허용 (학습용 — 학생이
        # 'ip saddr 10.20.30.202 drop' 같은 룰 추가하며 학습)
        ct state established,related accept
        # 학생 lab 에서 추가/제거할 위치
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

# NAT (학습 목적 — ext->pipe forward 시 source 변경 X — direct routing)
add table ip 6v6_nat
flush table ip 6v6_nat
table ip 6v6_nat {
    chain prerouting  { type nat hook prerouting  priority -100; }
    chain postrouting { type nat hook postrouting priority 100; }
}
