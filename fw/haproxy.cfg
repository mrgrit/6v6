global
    log stdout format raw local0
    log 10.20.32.100:514 local0  # de-NAT: 원본 client IP 를 SIEM 으로 (6v6 NAT 출처추적 결함 수정)
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    option forwardfor

# ─── HTTP frontend ───────────────────────────────────────
frontend http_in
    bind *:80

    # Host-header based routing
    acl is_siem    hdr(host) -i siem.6v6.lab
    acl is_portal  hdr(host) -i portal.6v6.lab
    acl is_bastion hdr(host) -i bastion.6v6.lab

    # Internal mgmt (ips까지만 — WAF 우회)
    use_backend dashboard if is_siem
    use_backend portal    if is_portal
    use_backend bastion   if is_bastion

    # Default — vuln endpoints (WAF 통과 강제)
    default_backend waf

# ─── HTTPS frontend (TLS terminate at fw, replay http to backends) ──
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/server.pem
    http-request set-header X-Forwarded-Proto https

    acl is_siem    hdr(host) -i siem.6v6.lab
    acl is_portal  hdr(host) -i portal.6v6.lab
    acl is_bastion hdr(host) -i bastion.6v6.lab

    use_backend dashboard if is_siem
    use_backend portal    if is_portal
    use_backend bastion   if is_bastion

    default_backend waf_tls

# ─── Bastion API frontend (port 9100) ──────────────────────
frontend bastion_api_in
    bind *:9100
    default_backend bastion_api

# ─── Backends ───────────────────────────────────────────
# Vuln endpoints: through ips → web (WAF) → vuln
backend waf
    server web 10.20.32.80:80 check

backend waf_tls
    server web 10.20.32.80:443 check ssl verify none

# Wazuh dashboard: through ips, NO WAF
backend dashboard
    server dashboard 10.20.32.120:5601 check ssl verify none

# Portal: through ips, NO WAF
backend portal
    server portal 10.20.32.50:8000 check

# Bastion API: routed back to ext-net (bastion is on ext)
backend bastion
    server bastion 10.20.30.201:9100 check

backend bastion_api
    server bastion 10.20.30.201:9100 check
