# 6v6 Windows 엔드포인트 — tiny11, KVM. 6v6-user 10.20.33.60 (사용자 PC zone).
# 트래픽: attacker(ext) → fw → ips(user .1) → win(.60). Wazuh agent → siem(dmz 10.20.32.100, ips routing).
services:
  win-endpoint:
    image: dockurr/windows
    container_name: 6v6-win
    environment:
      VERSION: "tiny11"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "48G"
      USERNAME: "ccc"
      PASSWORD: "ccc"
    devices: [ "/dev/kvm", "/dev/net/tun" ]
    cap_add: [ "NET_ADMIN" ]
    stop_grace_period: 2m
    restart: unless-stopped
    volumes:
      - "./win-storage:/storage"
      - "./win-oem:/oem"
      - "./win-shared:/data"
    networks:
      6v6-user:
        ipv4_address: 10.20.33.60
    ports: [ "8006:8006", "3389:3389" ]
networks:
  6v6-user: { external: true, name: 6v6-user }
